services:
  db:
    image: postgres:16-alpine
    container_name: todolab-db
    environment:
      POSTGRES_USER: todolab
      POSTGRES_PASSWORD: todolab
      POSTGRES_DB: todolab
    ports:
      - "5432:5432"
    volumes:
      - todolab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todolab -d todolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  todolab_pgdata:
